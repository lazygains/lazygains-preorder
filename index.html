<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Makanan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    fieldset.menu-category {
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      padding: 15px;
      margin-top: 15px;
    }

    legend {
      font-weight: bold;
      color: #d9534f;
      padding: 0 8px;
      font-size: 1.1em;
    }

    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .option-item:last-child {
      margin-bottom: 0;
    }

    .option-item label {
      cursor: pointer;
      flex-grow: 1;
      margin-left: 8px;
      color: #444;
    }

    .badge-limited {
      background-color: #ff9800;
      color: white;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 4px;
      text-transform: uppercase;
    }

    .price {
      font-weight: bold;
      color: #2e7d32;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Menu Restoran</h1>

    <!-- Menu ADD ON Sauces -->
    <fieldset class="menu-category">
      <legend>ADD ON Sauces</legend>
      
      <div class="option-item">
        <input type="checkbox" id="lazy-gains" name="sauce" value="1500">
        <label for="lazy-gains">Lazy Gains Sauce</label>
        <span class="price">Rp 1.500</span>
      </div>

      <div class="option-item">
        <input type="checkbox" id="chili-sauce" name="sauce" value="900">
        <label for="chili-sauce">Chili Sauce</label>
        <span class="price">Rp 900</span>
      </div>

      <div class="option-item">
        <input type="checkbox" id="ketchup" name="sauce" value="600">
        <label for="ketchup">Ketchup</label>
        <span class="price">Rp 600</span>
      </div>

      <div class="option-item">
        <input type="checkbox" id="garlic-sauce" name="sauce" value="1500">
        <label for="garlic-sauce"><span class="badge-limited">LIMITED</span> Garlic Sauce</label>
        <span class="price">Rp 1.500</span>
      </div>
    </fieldset>
  </div>

</body>
</html>
